<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planejamento 50 Horas de Campo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta Padrão: 1. Azul Marinho Clássico */
      --bg-cream: #EEEBDA;
      --navy-base: #282B4A;
      --navy-dark: #121426;
      --navy-card: rgba(40, 43, 74, 0.92);
      --border-color: rgba(238, 235, 218, 0.2);
      --hover-color: rgba(238, 235, 218, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: var(--bg-cream);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }

    /* Container Lâmpada de Lava */
    .lava-lamp {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      filter: url("#goo") blur(8px);
      opacity: 0.75;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      background: var(--navy-base);
      bottom: -350px;
      will-change: transform;
      transition: background 0.4s ease;
    }

    .blob-1 {
      width: 220px;
      height: 220px;
      left: 20%;
      animation: floatLava1 22s infinite ease-in-out;
    }

    .blob-2 {
      width: 260px;
      height: 260px;
      left: 35%;
      animation: floatLava2 22s infinite ease-in-out;
      animation-delay: -3s;
    }

    .blob-3 {
      width: 180px;
      height: 180px;
      left: 70%;
      animation: floatLava1 18s infinite ease-in-out;
      animation-delay: -9s;
    }

    .blob-4 {
      width: 240px;
      height: 240px;
      left: 50%;
      animation: floatLava2 25s infinite ease-in-out;
      animation-delay: -14s;
    }

    @keyframes floatLava1 {
      0% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-80vh) scale(1.2, 0.85); }
      100% { transform: translateY(-160vh) scale(0.9, 1.1); }
    }

    @keyframes floatLava2 {
      0% { transform: translateY(0) translateX(0) scale(1, 1); }
      45% { transform: translateY(-75vh) translateX(-120px) scale(1.3, 1.1); }
      55% { transform: translateY(-85vh) translateX(-80px) scale(1.1, 1.3); }
      100% { transform: translateY(-160vh) translateX(40px) scale(0.95, 1); }
    }

    /* Botão Hambúrguer */
    .menu-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 100;
      background: var(--navy-base);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .menu-toggle span {
      width: 18px;
      height: 2px;
      background-color: var(--bg-cream);
      border-radius: 2px;
    }

    /* Sidebar Responsiva */
    .sidebar-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 320px;
      max-width: 85vw;
      height: 100vh;
      background: var(--navy-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 90;
      padding: 5rem 1.25rem 2rem 1.25rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: -5px 0 25px rgba(0,0,0,0.3);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 1px solid var(--border-color);
    }

    .sidebar-menu.active { right: 0; }

    /* Lista Vertical de Meses */
    #monthsMenu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: left;
      transition: all 0.2s ease;
      color: var(--bg-cream);
      width: 100%;
      display: block;
    }

    .menu-btn.active {
      background: var(--bg-cream);
      color: var(--navy-dark);
      font-weight: 600;
    }

    /* Seletor de Cores Arrumado */
    .color-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin: 1.5rem 0 0.75rem 0;
      opacity: 0.8;
      border-top: 1px dashed var(--border-color);
      padding-top: 1.25rem;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 1rem;
      width: 100%;
    }

    .color-dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.selected {
      border-color: #FFF;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255,255,255,0.7);
    }

    header, .quote-box, main {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .hero-svg {
      width: 48px;
      height: 48px;
      margin-bottom: 0.6rem;
    }

    .hero-svg path, .hero-svg rect {
      stroke: var(--navy-base);
      transition: stroke 0.4s ease;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      color: var(--navy-base);
      transition: color 0.4s ease;
    }

    p.subtitle {
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      color: var(--navy-base);
      transition: color 0.4s ease;
    }

    .quote-box {
      width: 100%;
      max-width: 800px;
      background: var(--navy-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .quote-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .quote-text {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      line-height: 1.4;
    }

    .quote-comment {
      font-size: 0.85rem;
      font-style: normal;
      font-weight: 300;
      margin-top: 0.8rem;
      opacity: 0.9;
      display: none;
      text-align: justify;
      line-height: 1.4;
      background: rgba(0,0,0,0.15);
      padding: 0.75rem;
      border-radius: 6px;
    }

    .toggle-comment-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.6rem;
      transition: background 0.2s;
    }

    .toggle-comment-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    main {
      width: 100%;
      max-width: 800px;
      background: var(--navy-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .month-header {
      margin-bottom: 1.25rem;
    }

    .month-title h2 {
      font-weight: 500;
      font-size: clamp(1.2rem, 3.5vw, 1.4rem);
    }

    .progress-box {
      margin-bottom: 1.25rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(238, 235, 218, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--bg-cream);
      width: 0%;
      transition: width 0.3s ease;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
      min-width: 300px;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .checkbox-custom {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--bg-cream);
      border-radius: 4px;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      background: transparent;
    }

    .checkbox-custom::before {
      content: "";
      width: 12px;
      height: 12px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      background-color: var(--bg-cream);
      border-radius: 2px;
    }

    .checkbox-custom:checked::before { transform: scale(1); }

    .rule-note {
      font-size: 0.8rem;
      opacity: 0.8;
      font-style: italic;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border-color);
    }

    .report-box {
      margin-top: 1.25rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: none;
    }

    .report-box.active { display: block; }

    .report-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .report-text {
      font-size: 0.85rem;
      background: var(--navy-dark);
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .photo-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
    }

    .photo-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .photo-upload-btn {
      background: transparent;
      border: 1px dashed var(--bg-cream);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.75rem;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--navy-dark);
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--bg-cream);
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn:active {
      background: var(--bg-cream);
      color: var(--navy-dark);
    }

    .month-content { display: none; }
    .month-content.active { display: block; }
  </style>
</head>
<body>

      <filter id="goo">
        <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur" />

      </filter>

  <button class="menu-toggle" id="menuToggle" aria-label="Abrir Menu">

    <span></span>

  <div class="menu-overlay" id="menuOverlay"></div>

          { date: "09/12", day: "Quinta", meta: "2h30" }, { date: "10/12", day: "Sexta", meta: "2h30" },
          { date: "13/12", day: "Segunda", meta: "2h30" }, { date: "14/12", day: "Terça", meta: "2h" },
          { date: "15/12", day: "Quarta", meta: "2h" }, { date: "16/12", day: "Quinta", meta: "2h" },
          { date: "17/12", day: "Sexta", meta: "2h" }, { date: "20/12", day: "Segunda", meta: "2h" },
          { date: "21/12", day: "Terça", meta: "2h" }, { date: "22/12", day: "Quarta", meta: "2h" },
          { date: "23/12", day: "Quinta", meta: "2h" }, { date: "24/12", day: "Sexta", meta: "2h" },
          { date: "27/12", day: "Segunda", meta: "2h" }, { date: "28/12", day: "Terça", meta: "2h" },
          { date: "29/12", day: "Quarta", meta: "2h" }, { date: "30/12", day: "Quinta", meta: "2h" },
          { date: "31/12", day: "Sexta", meta: "2h" }
        ]
      }
    ];

    const photoStore = {};

    function parseHours(str) {
      if(!str) return 0;
      let h = 0, m = 0;
      if (str.includes('h')) {
        const parts = str.split('h');
        h = parseInt(parts[0]) || 0;
        if (parts[1]) m = parseInt(parts[1]) || 0;
      }
      return h + (m / 60);
    }

    // Busca o Texto Diário com fallback duplo (Mais rápido e estável)
    async function fetchDailyText() {
      const quoteTitle = document.getElementById('quoteTitle');
      const quoteText = document.getElementById('dailyQuote');
      const quoteComment = document.getElementById('dailyComment');
      const toggleBtn = document.getElementById('toggleCommentBtn');

      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = hoje.getMonth() + 1;
      const dia = hoje.getDate();

      const targetUrl = `https://wol.jw.org/pt/wol/h/r5/lp-t/${ano}/${mes}/${dia}`;
      
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`
      ];

      for (let url of proxies) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;

          let htmlText = '';
          if (url.includes('allorigins')) {
            const data = await response.json();
            htmlText = data.contents;
          } else {
            htmlText = await response.text();
          }

          if (htmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            const textoEl = doc.querySelector('.themeScrp');
            const comentarioEl = doc.querySelector('.sb');
            const headerEl = doc.querySelector('.todayItems .singleGroup .header h2, .header h2');

            if (textoEl) {
              if (headerEl) {
                quoteTitle.textContent = `TEXTO DIÁRIO — ${headerEl.textContent.trim().toUpperCase()}`;
              }
              quoteText.innerHTML = textoEl.innerHTML;
              
              if (comentarioEl) {
                quoteComment.innerHTML = comentarioEl.innerHTML;
                toggleBtn.style.display = 'inline-block';
              }
              return;
            }
          }
        } catch (e) {
          console.log("Tentando próximo proxy...");
        }
      }

      quoteText.textContent = "Não foi possível carregar o texto diário no momento.";
    }

    function toggleComment() {
      const comment = document.getElementById('dailyComment');
      const btn = document.getElementById('toggleCommentBtn');
      if (comment.style.display === 'block') {
        comment.style.display = 'none';
        btn.textContent = 'Ler Comentário';
      } else {
        comment.style.display = 'block';
        btn.textContent = 'Ocultar Comentário';
      }
    }

    function initApp() {
      const monthsMenu = document.getElementById('monthsMenu');
      const colorGrid = document.getElementById('colorGrid');
      const monthsContainer = document.getElementById('monthsContainer');

      // Configura botões de seleção de cores em grade alinhada
      colorThemes.forEach((theme, idx) => {
        const dot = document.createElement('div');
        dot.className = `color-dot ${idx === 0 ? 'selected' : ''}`;
        dot.style.background = `linear-gradient(135deg, ${theme.navy} 50%, ${theme.bg} 50%)`;
        dot.title = theme.name;
        dot.onclick = () => setTheme(idx);
        colorGrid.appendChild(dot);
      });

      // Carrega tema salvo
      const savedTheme = localStorage.getItem('selectedTheme');
      if (savedTheme !== null) {
        setTheme(parseInt(savedTheme), false);
      }

      planData.forEach((month, index) => {
        photoStore[month.id] = [];

        const btn = document.createElement('button');
        btn.className = `menu-btn ${index === 0 ? 'active' : ''}`;
        btn.textContent = month.label;
        btn.onclick = () => {
          switchTab(month.id);
          toggleMenu();
        };
        monthsMenu.appendChild(btn);

        const monthDiv = document.createElement('div');
        monthDiv.className = `month-content ${index === 0 ? 'active' : ''}`;
        monthDiv.id = month.id;

        let rowsHtml = '';
        month.days.forEach((d, idx) => {
          const storageKey = `${month.id}-${idx}`;
          const isChecked = localStorage.getItem(storageKey) === 'true';

          rowsHtml += `
            <tr>
              <td>${d.date}</td>
              <td>${d.day}</td>
              <td>${d.meta}</td>
              <td style="text-align: center;">
                <input type="checkbox" 
                       class="checkbox-custom" 
                       data-month="${month.id}"
                       data-meta="${d.meta}"
                       data-key="${storageKey}"
                       ${isChecked ? 'checked' : ''} 
                       onchange="updateProgress('${month.id}', '${month.title}')">
              </td>
            </tr>
          `;
        });

        monthDiv.innerHTML = `
          <div class="month-header">
            <div class="month-title">
              <h2>${month.title}</h2>
            </div>
          </div>

          <div class="progress-box">
            <div class="progress-info">
              <span>Progresso da Meta (${month.target})</span>
              <span id="prog-text-${month.id}">0h / ${month.target}</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="prog-bar-${month.id}"></div>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Dia</th>
                  <th>Meta</th>
                  <th style="text-align: center;">Feito ✓</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <p class="rule-note">${month.rule}</p>
          
          <div class="report-box" id="report-box-${month.id}">
            <div class="report-title">Relatório do Mês</div>
            <div class="report-text" id="report-text-${month.id}"></div>
            <button class="btn" id="copy-btn-${month.id}" onclick="copyReport('${month.id}')">
              Copiar Mensagem
            </button>
          </div>

          <div class="photo-section">
            <div class="photo-title">
              <span>Fotos do Mês</span>
              <label class="photo-upload-btn">
                + Adicionar Foto
                <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto(event, '${month.id}')">
              </label>
            </div>
            <div class="photo-grid" id="photo-grid-${month.id}"></div>
          </div>
        `;

        monthsContainer.appendChild(monthDiv);
      });

      planData.forEach(m => {
        updateProgress(m.id, m.title);
        renderPhotos(m.id);
      });

      fetchDailyText();
    }

    function setTheme(index, save = true) {
      const theme = colorThemes[index];
      if (!theme) return;

      document.documentElement.style.setProperty('--bg-cream', theme.bg);
      document.documentElement.style.setProperty('--navy-base', theme.navy);
      document.documentElement.style.setProperty('--navy-dark', theme.dark);
      document.documentElement.style.setProperty('--navy-card', hexToRgba(theme.navy, 0.92));
      document.documentElement.style.setProperty('--border-color', hexToRgba(theme.bg, 0.25));

      document.querySelectorAll('.color-dot').forEach((dot, i) => {
        dot.classList.toggle('selected', i === index);
      });

      if (save) {
        localStorage.setItem('selectedTheme', index);
      }
    }

    function hexToRgba(hex, alpha) {
      hex = hex.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    const menuToggle = document.getElementById('menuToggle');
    const menuOverlay = document.getElementById('menuOverlay');

    function toggleMenu() {
      document.getElementById('sidebarMenu').classList.toggle('active');
      menuOverlay.classList.toggle('active');
    }

    menuToggle.onclick = toggleMenu;
    menuOverlay.onclick = toggleMenu;

    function switchTab(monthId) {
      document.querySelectorAll('.menu-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', planData[idx].id === monthId);
      });
      document.querySelectorAll('.month-content').forEach(content => {
        content.classList.toggle('active', content.id === monthId);
      });
    }

    function updateProgress(monthId, monthTitle) {
      const checkboxes = document.querySelectorAll(`input[data-month="${monthId}"]`);
      let totalDone = 0;

      checkboxes.forEach(cb => {
        localStorage.setItem(cb.dataset.key, cb.checked);
        if (cb.checked) {
          totalDone += parseHours(cb.dataset.meta);
        }
      });

      const hours = Math.floor(totalDone);
      const minutes = Math.round((totalDone - hours) * 60);
      const doneFormatted = minutes > 0 ? `${hours}h${minutes.toString().padStart(2, '0')}` : `${hours}h`;

      const targetValue = 50;
      const percentage = Math.min((totalDone / targetValue) * 100, 100);

      document.getElementById(`prog-text-${monthId}`).textContent = `${doneFormatted} / 50h`;
      document.getElementById(`prog-bar-${monthId}`).style.width = `${percentage}%`;

      const reportBox = document.getElementById(`report-box-${monthId}`);
      const reportText = document.getElementById(`report-text-${monthId}`);

      if (totalDone > 0) {
        reportBox.classList.add('active');
        reportText.textContent = `Olá! Eu participei no campo no mês de ${monthTitle}, fiz ${doneFormatted} de horas de campo cumpridas.`;
      } else {
        reportBox.classList.remove('active');
      }
    }

    // Copiar com suporte universal
    function copyReport(monthId) {
      const text = document.getElementById(`report-text-${monthId}`).textContent;
      const btn = document.getElementById(`copy-btn-${monthId}`);

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyFeedback(btn);
        }).catch(() => {
          fallbackCopy(text, btn);
        });
      } else {
        fallbackCopy(text, btn);
      }
    }

    function fallbackCopy(text, btn) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand('copy');
        showCopyFeedback(btn);
      } catch (err) {
        alert('Erro ao copiar a mensagem.');
      }
      document.body.removeChild(textarea);
    }

    function showCopyFeedback(btn) {
      const originalText = btn.textContent;
      btn.textContent = '✓ Copiado com sucesso!';
      btn.style.fontWeight = 'bold';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.fontWeight = 'normal';
      }, 2000);
    }

    function uploadPhoto(event, monthId) {
      const file = event.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      photoStore[monthId].push(url);
      renderPhotos(monthId);
    }

    function renderPhotos(monthId) {
      const grid = document.getElementById(`photo-grid-${monthId}`);
      if (!grid) return;
      const photos = photoStore[monthId] || [];

      grid.innerHTML = photos.map((src, index) => `
        <div class="photo-card">
          <img src="${src}" onclick="openPhoto('${src}')" alt="Foto do Campo">
          <button class="photo-delete" onclick="deletePhoto('${monthId}', ${index})">✕</button>
        </div>
      `).join('');
    }

    function deletePhoto(monthId, index) {
      photoStore[monthId].splice(index, 1);
      renderPhotos(monthId);
    }

    function openPhoto(src) {
      const w = window.open("");
      w.document.write(`<body style="margin:0; background:var(--navy-dark); display:flex; align-items:center; justify-content:center; min-height:100vh;"><img src="${src}" style="max-width:100%; max-height:100vh; object-fit:contain;"></body>`);
    }

    window.onload = initApp;
  </script>
</body>
